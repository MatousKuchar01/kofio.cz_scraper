[package]
name = "kofio-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive"] }
# HTTP client
reqwest = { version = "0.11", features = ["blocking"] }
# HTML parsing
scraper = "0.18"
# Table formating
comfy-table = "7.1"
# Spinner and loader
indicatif = "0.17"
# Colors in CLI
colored = "2.1"
